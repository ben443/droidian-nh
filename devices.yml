########################################################################
# Basic anchors                                                        #
########################################################################

.devtools_packages:
  packages: &devtools_packages
    - droidian-devtools
    - adaptation-hybris-devtools

.adaptation_generic_packages:
  packages: &adaptation_generic_packages
    - adaptation-android-generic

########################################################################
# Recovery-flashable rootfses                                          #
########################################################################

rootfs:
  type: rootfs
  arch: [arm64]
  edition: phosh
  variant: phone
  apilevel: [30,32]

  packages: *adaptation_generic_packages

  bundles:
   #  Developer tools bundle
    - name: nethunter-pro-halium-devtools
      arch: [arm64]
      apilevel: [30,32]
      only_stable: no
      packages: *devtools_packages

